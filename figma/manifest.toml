description = "Delete a comment (only the author can delete it)"
input_schema = { type = "object", properties = { file_key = { type = "string", description = "File key (or branch key)" }, comment_id = { type = "string", description = "ID of the comment to delete" } }, required = ["file_key", "comment_id"] }
function = "delete_comment"
[tools.delete-comment.annotations]
title = "Delete Comment"
read_only_hint = false
