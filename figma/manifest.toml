name = "figma"
version = "1.0.0"
homepage = "https://github.com/Datron/jilebi-plugins"
creator = "jilebi"
contact = "support@jilebi.ai"

[secrets]
FIGMA_TOKEN = { schema = { type = "string", description = "Figma personal access token (sent as X-Figma-Token header)" } }

[resources]

[prompts.design-review]
name = "design-review"
description = "Review a Figma file for design consistency, component usage and accessibility"
arguments = [
	{ name = "file_key", description = "Figma file key (from the file URL)", required = true },
	{ name = "focus", description = "What to focus on (e.g. consistency, accessibility, component reuse)", required = false },
]
messages = [
	{ role = "user", type = "text", content = "You are a product design reviewer. Fetch the Figma file with get-file and its comments with get-comments, then review it for layout consistency, typography, color usage and component reuse." },
	{ role = "user", type = "text", content = "Review Figma file {{file_key}}{{#if focus}} focusing on {{focus}}{{/if}}. Summarize findings as a prioritized list with file/node references." },
]

[prompts.dev-handoff]
name = "dev-handoff"
description = "Produce a developer handoff summary for Figma nodes (layout, assets, variables)"
arguments = [
	{ name = "file_key", description = "Figma file key (from the file URL)", required = true },
	{ name = "node_ids", description = "Comma-separated node IDs to hand off", required = true },
]
messages = [
	{ role = "user", type = "text", content = "You are a design-to-code handoff assistant. Use get-file-nodes to inspect the nodes, get-images for exportable assets, and get-local-variables plus get-dev-resources for tokens and links." },
	{ role = "user", type = "text", content = "Prepare a developer handoff for file {{file_key}}, nodes {{node_ids}}: structure, dimensions, assets to export, variables/tokens and open questions." },
]

[tools.get-file]
name = "get-file"
description = "Get the JSON document of a Figma file (parse file_key from the file URL)"
input_schema = { type = "object", properties = { file_key = { type = "string", description = "File key (or branch key) from the Figma file URL" }, version = { type = "string", description = "Specific version ID (omit for current version)" }, ids = { type = "string", description = "Comma-separated node IDs to return a subset of the document" }, depth = { type = "number", description = "How deep into the document tree to traverse" }, geometry = { type = "string", description = "Set to 'paths' to export vector data" }, plugin_data = { type = "string", description = "Comma-separated plugin IDs and/or 'shared'" }, branch_data = { type = "boolean", description = "Return branch metadata for the file" } }, required = ["file_key"] }
function = "get_file"
[tools.get-file.annotations]
title = "Get File"
read_only_hint = true
destructive_hint = false
idempotent_hint = true
open_world_hint = false
[tools.get-file.permissions]
hosts = ["https://api.figma.com"]

[tools.get-file-nodes]
name = "get-file-nodes"
description = "Get JSON for specific nodes in a Figma file"
input_schema = { type = "object", properties = { file_key = { type = "string", description = "File key (or branch key)" }, ids = { type = "string", description = "Comma-separated node IDs to retrieve" }, version = { type = "string", description = "Specific version ID" }, depth = { type = "number", description = "Depth to traverse from the requested nodes" }, geometry = { type = "string", description = "Set to 'paths' to export vector data" }, plugin_data = { type = "string", description = "Comma-separated plugin IDs and/or 'shared'" } }, required = ["file_key", "ids"] }
function = "get_file_nodes"
[tools.get-file-nodes.annotations]
title = "Get File Nodes"
read_only_hint = true
destructive_hint = false
idempotent_hint = true
open_world_hint = false
[tools.get-file-nodes.permissions]
hosts = ["https://api.figma.com"]

[tools.get-images]
name = "get-images"
description = "Render images of file nodes (returns node ID to expiring image URL map)"
input_schema = { type = "object", properties = { file_key = { type = "string", description = "File key (or branch key)" }, ids = { type = "string", description = "Comma-separated node IDs to render" }, version = { type = "string", description = "Specific version ID" }, scale = { type = "number", description = "Image scaling factor between 0.01 and 4" }, format = { type = "string", enum = ["jpg", "png", "svg", "pdf"], description = "Image output format (default png)" }, svg_outline_text = { type = "boolean", description = "Render text as outlines in SVGs" }, svg_include_id = { type = "boolean", description = "Include layer names as SVG id attributes" }, svg_include_node_id = { type = "boolean", description = "Include node IDs as data-node-id attributes" }, svg_simplify_stroke = { type = "boolean", description = "Simplify inside/outside strokes in SVGs" }, contents_only = { type = "boolean", description = "Exclude overlapping content from rendering" }, use_absolute_bounds = { type = "boolean", description = "Use full node dimensions regardless of cropping" } }, required = ["file_key", "ids"] }
function = "get_images"
[tools.get-images.annotations]
title = "Render Images"
read_only_hint = true
destructive_hint = false
idempotent_hint = true
open_world_hint = false
[tools.get-images.permissions]
hosts = ["https://api.figma.com"]

