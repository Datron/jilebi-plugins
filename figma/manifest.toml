function = "post_comment"
[tools.post-comment.annotations]
title = "Post Comment"
read_only_hint = false
destructive_hint = false
idempotent_hint = false
open_world_hint = false
[tools.post-comment.permissions]
hosts = ["https://api.figma.com"]

[tools.delete-comment]
