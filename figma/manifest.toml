input_schema = { type = "object", properties = { file_key = { type = "string", description = "File key (or branch key)" }, as_md = { type = "boolean", description = "Return comments as markdown equivalents when applicable" } }, required = ["file_key"] }
function = "get_comments"
[tools.get-comments.annotations]
title = "Get Comments"
read_only_hint = true
