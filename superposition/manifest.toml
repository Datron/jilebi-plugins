name = "superposition"
version = "1.0.0"
homepage = "https://github.com/juspay/superposition"
creator = "juspay"
contact = "https://github.com/juspay/superposition/issues"

[env]
SUPERPOSITION_BASE_URL = { schema = { type = "string" }, default = "http://localhost:8080" }
SUPERPOSITION_ORG_ID = { schema = { type = "string" } }
SUPERPOSITION_WORKSPACE = { schema = { type = "string" } }

[resources]

[prompts]

[tools.add-members-to-group]
name = "add-members-to-group"
description = "Adds members to an existing experiment group."
function = "add_members_to_group"

[tools.add-members-to-group.input_schema]
type = "object"
required = ["id", "change_reason", "member_experiment_ids"]

[tools.add-members-to-group.input_schema.properties.id]
type = "string"

[tools.add-members-to-group.input_schema.properties.org_id]
type = "string"
description = "Optional: falls back to SUPERPOSITION_ORG_ID / SUPERPOSITION_WORKSPACE env."

[tools.add-members-to-group.input_schema.properties.workspace]
type = "string"
description = "Optional: falls back to SUPERPOSITION_ORG_ID / SUPERPOSITION_WORKSPACE env."

[tools.add-members-to-group.input_schema.properties.change_reason]
type = "string"
description = "Reason for adding these members."

[tools.add-members-to-group.input_schema.properties.member_experiment_ids]
type = "array"
description = "List of experiment IDs to add/remove to this group."

[tools.add-members-to-group.input_schema.properties.member_experiment_ids.items]
type = "string"

[tools.add-members-to-group.annotations]
title = "AddMembersToGroup"
read_only_hint = false
destructive_hint = false
idempotent_hint = true
open_world_hint = false

[tools.add-members-to-group.permissions]
hosts = ["user_defined"]

[tools.applicable-variants]
name = "applicable-variants"
description = "Determines which experiment variants are applicable to a given context, used for experiment evaluation and variant selection."
function = "applicable_variants"

[tools.applicable-variants.input_schema]
type = "object"
required = ["identifier", "context"]

[tools.applicable-variants.input_schema.properties.identifier]
type = "string"

[tools.applicable-variants.input_schema.properties.prefix]
type = "array"

[tools.applicable-variants.input_schema.properties.prefix.items]
type = "string"

[tools.applicable-variants.input_schema.properties.exclude_prefix]
type = "array"

[tools.applicable-variants.input_schema.properties.exclude_prefix.items]
type = "string"

[tools.applicable-variants.input_schema.properties.org_id]
type = "string"
description = "Optional: falls back to SUPERPOSITION_ORG_ID / SUPERPOSITION_WORKSPACE env."

[tools.applicable-variants.input_schema.properties.workspace]
type = "string"
description = "Optional: falls back to SUPERPOSITION_ORG_ID / SUPERPOSITION_WORKSPACE env."

[tools.applicable-variants.input_schema.properties.context]
type = "object"
description = "Represents conditional criteria used for context matching. Keys define dimension names and values specify the criteria that must be met."

[tools.applicable-variants.annotations]
title = "ApplicableVariants"
read_only_hint = false
destructive_hint = false
idempotent_hint = false
open_world_hint = false

[tools.applicable-variants.permissions]
hosts = ["user_defined"]

[tools.bulk-operation]
name = "bulk-operation"
description = "Executes multiple context operations (PUT, REPLACE, DELETE, MOVE) in a single atomic transaction for efficient batch processing."
function = "bulk_operation"

[tools.bulk-operation.input_schema]
type = "object"
required = ["operations"]

[tools.bulk-operation.input_schema.properties.config_tags]
type = "string"

[tools.bulk-operation.input_schema.properties.org_id]
type = "string"
description = "Optional: falls back to SUPERPOSITION_ORG_ID / SUPERPOSITION_WORKSPACE env."

[tools.bulk-operation.input_schema.properties.workspace]
type = "string"
description = "Optional: falls back to SUPERPOSITION_ORG_ID / SUPERPOSITION_WORKSPACE env."

[tools.bulk-operation.input_schema.properties.operations]
type = "array"
description = "operations"

[tools.bulk-operation.input_schema.properties.operations.items]
type = "object"

[tools.bulk-operation.annotations]
title = "BulkOperation"
read_only_hint = false
destructive_hint = false
idempotent_hint = true
open_world_hint = false

[tools.bulk-operation.permissions]
hosts = ["user_defined"]

[tools.conclude-experiment]
name = "conclude-experiment"
description = "Concludes an inprogress experiment by selecting a winning variant and transitioning the experiment to a concluded state."
function = "conclude_experiment"

[tools.conclude-experiment.input_schema]
type = "object"
required = ["id", "chosen_variant", "change_reason"]

[tools.conclude-experiment.input_schema.properties.id]
