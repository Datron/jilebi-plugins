# ===================== WRITE TOOLS =====================

[tools.create-issue]
name = "create-issue"
description = "Create a new Jira issue. Supports setting project, summary, type, description (in markdown), assignee (account ID), components, and additional custom fields via JSON."
function = "create_issue"
input_schema = { type = "object", properties = { project_key = { type = "string", description = "The project key (e.g. 'PROJ')" }, summary = { type = "string", description = "Issue summary/title" }, issue_type = { type = "string", description = "Issue type name (e.g. 'Bug', 'Story', 'Task', 'Epic')" }, description = { type = "string", description = "Issue description in markdown format" }, assignee = { type = "string", description = "Assignee account ID" }, components = { type = "string", description = "Comma-separated component names" }, additional_fields = { type = "string", description = "JSON string of additional fields (e.g. '{\"priority\": \"High\", \"labels\": \"bug,urgent\"}')" } }, required = ["project_key", "summary", "issue_type"] }

[tools.create-issue.annotations]
title = "Create Issue"
read_only_hint = false
destructive_hint = false
idempotent_hint = false
open_world_hint = false

[tools.create-issue.permissions]
