name = "jira"
version = "1.0.0"
homepage = "https://github.com/atlassian-labs/mcp-atlassian"
creator = "Atlassian"
contact = ""

[secrets]
JIRA_API_TOKEN = { schema = { type = "string" } }
JIRA_EMAIL = { schema = { type = "string" } }

[env]
JIRA_BASE_URL = { schema = { type = "string" }, default = "https://your-domain.atlassian.net" }

[resources]

[prompts]

[prompts.issue-triage-workflow]
name = "issue-triage-workflow"
description = "Triage and prioritize Jira issues by analyzing their details, status, and SLA metrics"
arguments = [
	{ name = "project_key", description = "Jira project key (e.g. PROJ)", required = true },
	{ name = "jql_filter", description = "Optional JQL filter to narrow down issues (e.g. 'status = Open AND priority = High')", required = false },
	{ name = "max_issues", description = "Maximum number of issues to triage (default 10)", required = false },
]
messages = [
	{ role = "user", type = "text", content = "You are a Jira issue triage assistant. Your goal is to help the user review, categorize, and prioritize issues. For each issue you should: 1) Summarize the issue details, 2) Check SLA/performance metrics if relevant, 3) Suggest priority level and next actions, 4) Identify any issues that need immediate attention (overdue, SLA breach, etc.)." },
	{ role = "user", type = "text", content = "Please triage issues in project {{project_key}}.{{#if jql_filter}} Use this filter: {{jql_filter}}.{{/if}}{{#if max_issues}} Limit to {{max_issues}} issues.{{/if}} For each issue, provide a summary with current status, assignee, priority, and any SLA concerns. Highlight issues that need immediate attention." },
	{ role = "assistant", type = "text", content = "I'll triage the issues in project {{project_key}}. Let me start by searching for the issues and analyzing their details and metrics." },
]

[prompts.sprint-planning-workflow]
name = "sprint-planning-workflow"
description = "Assist with sprint planning by analyzing backlog, current sprint status, team capacity, and suggesting sprint scope"
arguments = [
	{ name = "project_key", description = "Jira project key (e.g. PROJ)", required = true },
	{ name = "board_name", description = "Name of the agile board to use", required = false },
	{ name = "sprint_goal", description = "Optional sprint goal or theme to guide planning", required = false },
]
messages = [
	{ role = "user", type = "text", content = "You are a sprint planning assistant for Jira. Your goal is to help the user plan an upcoming sprint. You should: 1) Review the current sprint status and any carry-over items, 2) Analyze the backlog for candidate issues, 3) Check issue sizes, priorities, and dependencies, 4) Suggest a sprint scope based on capacity and priorities, 5) Help create or update the sprint if needed." },
	{ role = "user", type = "text", content = "Help me plan the next sprint for project {{project_key}}.{{#if board_name}} Use the board named '{{board_name}}'.{{/if}}{{#if sprint_goal}} The sprint goal is: {{sprint_goal}}.{{/if}} Please review the current sprint status, analyze the backlog, and suggest which issues to include in the next sprint." },
	{ role = "assistant", type = "text", content = "I'll help you plan the next sprint for {{project_key}}. Let me start by finding the relevant board and reviewing the current sprint and backlog." },
]

[prompts.bug-investigation-workflow]
name = "bug-investigation-workflow"
description = "Investigate a bug by gathering issue details, related issues, changelogs, and timeline information"
arguments = [
	{ name = "issue_key", description = "The bug issue key (e.g. PROJ-123)", required = true },
	{ name = "include_related", description = "Whether to check linked/related issues (default true)", required = false },
]
messages = [
	{ role = "user", type = "text", content = "You are a bug investigation assistant for Jira. Your goal is to help the user understand and diagnose a bug. You should: 1) Get the full issue details including description, comments, and attachments, 2) Review the changelog to understand when and how the issue evolved, 3) Check linked issues and dependencies for related problems, 4) Analyze the timeline (dates, SLA metrics) to understand response and resolution patterns, 5) Summarize findings and suggest next steps." },
	{ role = "user", type = "text", content = "Please investigate bug {{issue_key}}. I need a comprehensive analysis of this issue including its history, related issues, timeline, and any patterns that might help diagnose the problem.{{#if include_related}} Also check any linked or related issues for additional context.{{/if}}" },
	{ role = "assistant", type = "text", content = "I'll investigate bug {{issue_key}} thoroughly. Let me start by gathering the issue details, changelog, and related information." },
]

# ===================== READ TOOLS =====================

[tools.get-user-profile]
name = "get-user-profile"
description = "Get profile information for a Jira user by account ID, email, or display name. Returns display name, email, active status, timezone and locale."
function = "get_user_profile"
input_schema = { type = "object", properties = { user_identifier = { type = "string", description = "The user's account ID, email address, or display name" } }, required = ["user_identifier"] }

[tools.get-user-profile.annotations]
title = "Get User Profile"
read_only_hint = true
destructive_hint = false
idempotent_hint = true
open_world_hint = false

[tools.get-user-profile.permissions]
hosts = ["user_defined"]

[tools.get-issue]
name = "get-issue"
description = "Get details of a specific Jira issue including status, assignee, description, comments, links, subtasks, and attachments. Use the fields parameter to control which fields are returned."
function = "get_issue"
input_schema = { type = "object", properties = { issue_key = { type = "string", description = "The issue key (e.g. 'PROJ-123')" }, fields = { type = "string", description = "Comma-separated list of fields to return, or '*all' for all fields. Default: summary,description,status,assignee,reporter,labels,priority,created,updated,issuetype" }, expand = { type = "string", description = "Comma-separated list of fields to expand (e.g. 'changelog,renderedFields')" }, comment_limit = { type = "number", description = "Maximum number of comments to include (0-100, default 10)" } }, required = ["issue_key"] }

[tools.get-issue.annotations]
title = "Get Issue"
read_only_hint = true
destructive_hint = false
idempotent_hint = true
open_world_hint = false

[tools.get-issue.permissions]
hosts = ["user_defined"]

[tools.search-issues]
name = "search-issues"
description = "Search for Jira issues using JQL (Jira Query Language). Examples: 'project = PROJ AND status = \"In Progress\"', 'assignee = currentUser() AND resolution = Unresolved', 'labels = bug AND priority = High ORDER BY created DESC'."
function = "search_issues"
input_schema = { type = "object", properties = { jql = { type = "string", description = "JQL query string" }, fields = { type = "string", description = "Comma-separated list of fields to return, or '*all' for all fields" }, limit = { type = "number", description = "Maximum number of results (1-50, default 10)" }, start_at = { type = "number", description = "Pagination offset (0-based, default 0)" }, expand = { type = "string", description = "Comma-separated list of fields to expand" } }, required = ["jql"] }

[tools.search-issues.annotations]
title = "Search Issues"
read_only_hint = true
destructive_hint = false
idempotent_hint = true
open_world_hint = false

[tools.search-issues.permissions]
hosts = ["user_defined"]

[tools.search-fields]
name = "search-fields"
description = "Search Jira fields by keyword. Returns field ID, name, type, and whether it's custom. Useful for finding custom field IDs needed for create/update operations."
function = "search_fields"
input_schema = { type = "object", properties = { keyword = { type = "string", description = "Keyword to search for in field names, IDs, and clause names. Leave empty to list all fields." }, limit = { type = "number", description = "Maximum number of results (1-100, default 10)" } }, required = [] }

[tools.search-fields.annotations]
title = "Search Fields"
read_only_hint = true
destructive_hint = false
idempotent_hint = true
open_world_hint = false

[tools.search-fields.permissions]
hosts = ["user_defined"]

[tools.get-project-issues]
