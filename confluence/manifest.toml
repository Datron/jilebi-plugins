name = "confluence"
version = "1.0.0"
homepage = "https://github.com/atlassian-labs/mcp-atlassian"
creator = "Atlassian"
contact = ""

[secrets]
CONFLUENCE_API_TOKEN = { schema = { type = "string" } }
CONFLUENCE_EMAIL = { schema = { type = "string" } }

[env]
CONFLUENCE_BASE_URL = { schema = { type = "string" }, default = "https://your-domain.atlassian.net" }

[resources]

[prompts]

[prompts.documentation-workflow]
name = "documentation-workflow"
description = "Create or update documentation pages in Confluence with proper structure and formatting"
arguments = [
	{ name = "space_key", description = "Confluence space key (e.g. DEV, DOCS)", required = true },
	{ name = "topic", description = "Topic or subject to document", required = true },
	{ name = "parent_page_title", description = "Optional parent page title to create the doc under", required = false },
	{ name = "doc_type", description = "Type of documentation: guide, reference, runbook, adr, or general (default general)", required = false },
]
messages = [
	{ role = "user", type = "text", content = "You are a documentation assistant for Confluence. Your goal is to help the user create well-structured documentation. You should: 1) Search for any existing pages on the topic to avoid duplication, 2) If updating, get the current page content first, 3) Create or update pages with proper headings, formatting, and organization, 4) Add appropriate labels for discoverability, 5) Link related pages when relevant." },
	{ role = "user", type = "text", content = "I need to create documentation about '{{topic}}' in the {{space_key}} space.{{#if parent_page_title}} It should be created under the page '{{parent_page_title}}'.{{/if}}{{#if doc_type}} The documentation type is: {{doc_type}}.{{/if}} Please check if any related documentation already exists, then help me create a well-structured page." },
	{ role = "assistant", type = "text", content = "I'll help you create documentation about '{{topic}}' in the {{space_key}} space. Let me first search for any existing related pages to avoid duplication." },
]

[prompts.knowledge-base-search-workflow]
name = "knowledge-base-search-workflow"
description = "Search and synthesize information across Confluence spaces to answer questions or compile research"
arguments = [
	{ name = "question", description = "The question or topic to research", required = true },
	{ name = "spaces", description = "Optional comma-separated list of space keys to search in", required = false },
	{ name = "max_pages", description = "Maximum number of pages to review (default 5)", required = false },
]
messages = [
	{ role = "user", type = "text", content = "You are a knowledge base search assistant for Confluence. Your goal is to find and synthesize information across Confluence to answer the user's question. You should: 1) Search for relevant pages using multiple search strategies (keyword, CQL filters), 2) Read the most relevant pages in full, 3) Synthesize information from multiple sources, 4) Provide a comprehensive answer with references to source pages, 5) Note any gaps or contradictions in the documentation." },
	{ role = "user", type = "text", content = "I need to find information about: {{question}}{{#if spaces}}\n\nSearch in these spaces: {{spaces}}{{/if}}{{#if max_pages}}\nReview up to {{max_pages}} pages.{{/if}} Please search Confluence, read the relevant pages, and provide a comprehensive answer with references." },
	{ role = "assistant", type = "text", content = "I'll search Confluence to find information about '{{question}}'. Let me start by searching for relevant pages." },
]

[tools.search]
name = "search"
description = "Search Confluence content using simple text terms or CQL (Confluence Query Language). Simple text queries are automatically converted to CQL. Examples: 'project docs', 'type=page AND space=DEV', 'title~\"Meeting Notes\"', 'label=documentation', 'lastModified > startOfMonth(\"-1M\")'."
function = "search"
input_schema = { type = "object", properties = { query = { type = "string", description = "Search query - simple text or CQL query string" }, limit = { type = "number", description = "Maximum number of results (1-50, default 10)" }, spaces_filter = { type = "string", description = "Comma-separated list of space keys to filter results" } }, required = [
	"query",
] }

[tools.search.annotations]
title = "Search Content"
read_only_hint = true
destructive_hint = false
idempotent_hint = true
open_world_hint = false

[tools.search.permissions]
hosts = ["user_defined"]

[tools.get-page]
name = "get-page"
description = "Get content of a specific Confluence page by its numeric ID, or by its exact title and space key. The page ID can be found in the URL, e.g. 'https://example.atlassian.net/wiki/spaces/TEAM/pages/123456789/Title' -> page_id is '123456789'."
function = "get_page"
input_schema = { type = "object", properties = { page_id = { type = "string", description = "Confluence page ID (numeric). Provide this OR both title and space_key." }, title = { type = "string", description = "Exact page title. Use with space_key if page_id is not known." }, space_key = { type = "string", description = "Space key (e.g. 'DEV', 'TEAM'). Required when using title." }, include_metadata = { type = "boolean", description = "Include page metadata like version, labels, etc. (default true)" }, convert_to_markdown = { type = "boolean", description = "Convert content to markdown (true) or keep raw HTML (false). Default true." } }, required = [] }

[tools.get-page.annotations]
title = "Get Page"
read_only_hint = true
destructive_hint = false
idempotent_hint = true
open_world_hint = false

[tools.get-page.permissions]
hosts = ["user_defined"]

[tools.get-page-children]
name = "get-page-children"
description = "Get child pages of a specific Confluence page by its parent page ID. Returns a paginated list of child pages."
function = "get_page_children"
input_schema = { type = "object", properties = { parent_id = { type = "string", description = "The ID of the parent page" }, expand = { type = "string", description = "Fields to expand (e.g. 'version', 'body.storage'). Default 'version'." }, limit = { type = "number", description = "Maximum number of children to return (1-50, default 25)" }, include_content = { type = "boolean", description = "Whether to include page content (default false)" }, convert_to_markdown = { type = "boolean", description = "Convert content to markdown (default true)" }, start = { type = "number", description = "Pagination offset (0-based, default 0)" } }, required = [
	"parent_id",
] }

[tools.get-page-children.annotations]
title = "Get Page Children"
read_only_hint = true
destructive_hint = false
idempotent_hint = true
open_world_hint = false

[tools.get-page-children.permissions]
hosts = ["user_defined"]

[tools.get-comments]
name = "get-comments"
description = "Get all comments on a specific Confluence page."
function = "get_comments"
input_schema = { type = "object", properties = { page_id = { type = "string", description = "Confluence page ID" } }, required = [
	"page_id",
] }

[tools.get-comments.annotations]
title = "Get Comments"
read_only_hint = true
destructive_hint = false
idempotent_hint = true
open_world_hint = false

[tools.get-comments.permissions]
hosts = ["user_defined"]

[tools.get-labels]
name = "get-labels"
description = "Get all labels on a specific Confluence page."
function = "get_labels"
input_schema = { type = "object", properties = { page_id = { type = "string", description = "Confluence page ID" } }, required = [
	"page_id",
] }

[tools.get-labels.annotations]
title = "Get Labels"
read_only_hint = true
destructive_hint = false
idempotent_hint = true
open_world_hint = false

[tools.get-labels.permissions]
hosts = ["user_defined"]

[tools.add-label]
name = "add-label"
description = "Add a label to a Confluence page."
function = "add_label"
input_schema = { type = "object", properties = { page_id = { type = "string", description = "The ID of the page" }, name = { type = "string", description = "The label name to add" } }, required = [
	"page_id",
	"name",
] }

[tools.add-label.annotations]
title = "Add Label"
read_only_hint = false
destructive_hint = false
idempotent_hint = true
open_world_hint = false

[tools.add-label.permissions]
hosts = ["user_defined"]

[tools.create-page]
name = "create-page"
description = "Create a new Confluence page in a space. Content can be provided in storage format (HTML), wiki markup, or markdown (will be converted to storage format)."
function = "create_page"
input_schema = { type = "object", properties = { space_key = { type = "string", description = "Space key (e.g. 'DEV', 'TEAM')" }, title = { type = "string", description = "Page title" }, content = { type = "string", description = "Page content. Format depends on content_format." }, parent_id = { type = "string", description = "Optional parent page ID to create as a child page" }, content_format = { type = "string", description = "Content format: 'storage' (default, Confluence HTML), 'wiki', or 'markdown'" } }, required = [
	"space_key",
	"title",
	"content",
] }

[tools.create-page.annotations]
title = "Create Page"
read_only_hint = false
destructive_hint = false
idempotent_hint = false
open_world_hint = false

[tools.create-page.permissions]
hosts = ["user_defined"]

[tools.update-page]
name = "update-page"
description = "Update an existing Confluence page. Requires the page ID and new content. Automatically increments the version number."
function = "update_page"
input_schema = { type = "object", properties = { page_id = { type = "string", description = "The ID of the page to update" }, title = { type = "string", description = "The new page title" }, content = { type = "string", description = "The new page content" }, is_minor_edit = { type = "boolean", description = "Whether this is a minor edit (default false)" }, version_comment = { type = "string", description = "Optional comment for this version" }, parent_id = { type = "string", description = "Optional new parent page ID to move the page" }, content_format = { type = "string", description = "Content format: 'storage' (default), 'wiki', or 'markdown'" } }, required = [
	"page_id",
	"title",
	"content",
] }

[tools.update-page.annotations]
title = "Update Page"
read_only_hint = false
destructive_hint = true
idempotent_hint = false
open_world_hint = false

[tools.update-page.permissions]
hosts = ["user_defined"]

[tools.delete-page]
name = "delete-page"
description = "Delete a Confluence page by its ID. This action is irreversible."
function = "delete_page"
input_schema = { type = "object", properties = { page_id = { type = "string", description = "The ID of the page to delete" } }, required = [
	"page_id",
] }

[tools.delete-page.annotations]
title = "Delete Page"
read_only_hint = false
destructive_hint = true
idempotent_hint = false
open_world_hint = false

[tools.delete-page.permissions]
hosts = ["user_defined"]

[tools.add-comment]
name = "add-comment"
description = "Add a comment to a Confluence page. Content can be provided in markdown or Confluence storage format (HTML)."
function = "add_comment"
input_schema = { type = "object", properties = { page_id = { type = "string", description = "The ID of the page to comment on" }, content = { type = "string", description = "The comment content (markdown or HTML storage format)" } }, required = [
	"page_id",
	"content",
] }

[tools.add-comment.annotations]
title = "Add Comment"
read_only_hint = false
destructive_hint = false
idempotent_hint = false
open_world_hint = false

[tools.add-comment.permissions]
hosts = ["user_defined"]

[tools.search-user]
name = "search-user"
description = "Search for Confluence users by name or CQL. Simple names are automatically wrapped in a CQL fullname search."
function = "search_user"
input_schema = { type = "object", properties = { query = { type = "string", description = "User search query - a name or CQL (e.g. 'user.fullname ~ \"John\"')" }, limit = { type = "number", description = "Maximum number of results (1-50, default 10)" } }, required = [
	"query",
] }

[tools.search-user.annotations]
title = "Search User"
read_only_hint = true
destructive_hint = false
idempotent_hint = true
open_world_hint = false

[tools.search-user.permissions]
hosts = ["user_defined"]

[tools.get-spaces]
name = "get-spaces"
description = "List Confluence spaces. Returns space keys, names, and descriptions."
function = "get_spaces"
input_schema = { type = "object", properties = { limit = { type = "number", description = "Maximum number of spaces to return (1-100, default 25)" }, start = { type = "number", description = "Pagination offset (0-based, default 0)" }, type = { type = "string", description = "Filter by space type (e.g. 'global', 'personal')" } }, required = [] }

[tools.get-spaces.annotations]
title = "Get Spaces"
read_only_hint = true
destructive_hint = false
idempotent_hint = true
open_world_hint = false

[tools.get-spaces.permissions]
hosts = ["user_defined"]

[tools.get-page-views]
name = "get-page-views"
description = "Get view statistics for a Confluence page. Only available on Confluence Cloud."
function = "get_page_views"
input_schema = { type = "object", properties = { page_id = { type = "string", description = "Confluence page ID" }, include_title = { type = "boolean", description = "Whether to include the page title (default true)" } }, required = [
	"page_id",
] }

[tools.get-page-views.annotations]
title = "Get Page Views"
read_only_hint = true
destructive_hint = false
idempotent_hint = true
open_world_hint = false

[tools.get-page-views.permissions]
hosts = ["user_defined"]
